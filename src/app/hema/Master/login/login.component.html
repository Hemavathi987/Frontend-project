<div [ngStyle]="{
    'background-image': 'url(\'' + backgroundUrl + '\')',
    'background-size': 'cover',
    'background-position': 'center',
    'background-repeat': 'no-repeat',
    'height': '100vh',
    'width': '100%'
  }" class="d-flex flex-column">

  <!-- DARK OVERLAY -->
  <div class="vh-100 w-100 bg-dark bg-opacity-75 d-flex align-items-center">

    <div class="container-fluid ps-5">
  <div class="row justify-content-start">
    <div class="col-3 col-md-6 col-lg-4">

          <div class="card bg-dark bg-opacity-75 border border-danger shadow-lg text-light rounded-4">

            <div class="card-body p-4">

              <h3 class="text-center text-danger fw-bold mb-4">
                Login
              </h3>

              <form [formGroup]="passwordForm" (ngSubmit)="login()">

                <!-- USERNAME -->
                <div class="mb-3">
                  <label class="form-label fw-bold text-light">User Name</label>
                  <input type="text" formControlName="UserName" class="form-control bg-dark text-light border-danger"
                    placeholder="Enter User Name">
                  <small class="text-danger"
                    *ngIf="passwordForm.get('UserName')?.touched && passwordForm.get('UserName')?.invalid">
                    User Name is required
                  </small>
                </div>

                <!-- PASSWORD -->
                <div class="mb-3">
                  <label class="form-label fw-bold text-light">Password</label>

                  <div class="input-group">
                    <input [type]="passwordFieldType" formControlName="Passwords"
                      class="form-control bg-dark text-light border-danger" placeholder="Enter Password">

                    <button type="button" class="btn btn-outline-danger" (click)="togglePasswordVisibility()">
                      <i class="bi" [ngClass]="passwordFieldType === 'password'
                         ? 'bi-eye'
                         : 'bi-eye-slash'"></i>
                    </button>
                  </div>

                  <small class="text-danger"
                    *ngIf="passwordForm.get('Passwords')?.touched && passwordForm.get('Passwords')?.invalid">
                    Password is required
                  </small>
                </div>

                <!-- ROLE -->
                <div class="mb-4">
                  <label class="form-label fw-bold text-light">Role</label>
                  <select formControlName="Role" class="form-select bg-dark text-light border-danger">
                    <option value="">Select Role</option>
                    <option value="Admin">Admin</option>
                    <option value="Employee">Employee</option>
                  </select>
                  <small class="text-danger"
                    *ngIf="passwordForm.get('Role')?.touched && passwordForm.get('Role')?.invalid">
                    Role is required
                  </small>
                </div>

                <!-- BUTTONS -->
                <button type="submit" class="btn btn-danger w-100 fw-bold mb-2">
                  Login
                </button>

                <button type="reset" class="btn btn-outline-danger w-100 fw-bold">
                  Reset
                </button>

              </form>

            </div>
          </div>

        </div>

      </div>
    </div>

  </div>
</div>
